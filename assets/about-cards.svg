<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="100%" height="100%">
  <defs>
    <linearGradient id="stickBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff0f5" />
    </linearGradient>

    <!-- Washi Tape Pattern -->
    <pattern id="cardWashiTape" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ffb3d1" stroke-width="2" />
      <line x1="4" y1="0" x2="4" y2="8" stroke="#ffd6e7" stroke-width="2" />
    </pattern>

    <filter id="stickShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#f06292" flood-opacity="0.12" />
    </filter>
  </defs>

  <style>
    /* <![CDATA[ */
    .stick-font {
      font-family: ui-rounded, 'Varela Round', 'Nunito', 'Quicksand', system-ui, -apple-system, sans-serif;
    }
    /* ]]> */
  </style>

  <!-- CARD 1: FUELING CODE WITH (Top Left, slightly tilted -1deg) -->
  <g transform="translate(10, 8) rotate(-1 207 46)">
    <rect x="0" y="0" width="414" height="92" rx="18" fill="url(#stickBg1)" stroke="#ffb3d1" stroke-width="2.2" filter="url(#stickShadow)" />
    
    <!-- Mini Washi Tape Pin -->
    <rect x="180" y="-6" width="54" height="14" rx="3" fill="url(#cardWashiTape)" stroke="#f06292" stroke-width="0.7" opacity="0.8" />

    <!-- Cute Sticker Icon: Pink Cup & Heart Straw -->
    <g transform="translate(16, 18)">
      <circle cx="28" cy="28" r="24" fill="#ffd6e7" stroke="#ff8fb8" stroke-width="1.5" />
      <!-- Cup -->
      <path d="M 18 24 C 18 36 22 39 28 39 C 34 39 38 36 38 24 Z" fill="#ffffff" stroke="#f06292" stroke-width="1.4" />
      <ellipse cx="28" cy="24" rx="10" ry="3.5" fill="#ffb3d1" />
      <line x1="31" y1="24" x2="35" y2="16" stroke="#f06292" stroke-width="2" stroke-linecap="round" />
      <circle cx="36" cy="15" r="1.5" fill="#f06292" />
    </g>

    <!-- Texts -->
    <text x="80" y="34" class="stick-font" font-size="12" font-weight="900" fill="#f06292">✿ FUELING CODE WITH</text>
    <text x="80" y="58" class="stick-font" font-size="13.5" font-weight="700" fill="#5a2a45">
      Coffee &amp; matcha lattes
      <tspan fill="#a8688a" font-size="12" font-weight="600"> (creator of </tspan><tspan fill="#f06292" font-size="12" font-weight="800">CoffeeVerse</tspan><tspan fill="#a8688a" font-size="12" font-weight="600">)</tspan>
    </text>
  </g>

  <!-- CARD 2: CURRENTLY EXPLORING (Top Right, slightly tilted +1deg) -->
  <g transform="translate(436, 8) rotate(1 207 46)">
    <rect x="0" y="0" width="414" height="92" rx="18" fill="url(#stickBg1)" stroke="#ffb3d1" stroke-width="2.2" filter="url(#stickShadow)" />
    
    <rect x="180" y="-6" width="54" height="14" rx="3" fill="url(#cardWashiTape)" stroke="#f06292" stroke-width="0.7" opacity="0.8" />

    <!-- Cute Sticker Icon: Pastel 3D Cube -->
    <g transform="translate(16, 18)">
      <circle cx="28" cy="28" r="24" fill="#cfeaff" stroke="#ff8fb8" stroke-width="1.5" />
      <polygon points="28,16 38,22 28,28 18,22" fill="#ffffff" stroke="#f06292" stroke-width="1.2" />
      <polygon points="18,22 28,28 28,38 18,32" fill="#ffd6e7" stroke="#f06292" stroke-width="1.2" />
      <polygon points="28,28 38,22 38,32 28,38" fill="#e8d5ff" stroke="#f06292" stroke-width="1.2" />
      <circle cx="28" cy="28" r="1.8" fill="#fff7d6" stroke="#f06292" stroke-width="0.8" />
    </g>

    <!-- Texts -->
    <text x="80" y="34" class="stick-font" font-size="12" font-weight="900" fill="#a8688a">✿ CURRENTLY EXPLORING</text>
    <text x="80" y="56" class="stick-font" font-size="13" font-weight="700" fill="#5a2a45">
      Creative 3D web experiences with
      <tspan x="80" dy="19" fill="#f06292" font-size="12.5" font-weight="800">Three.js, React Three Fiber &amp; GSAP</tspan>
    </text>
  </g>

  <!-- CARD 3: ACTIVE PROJECTS (Bottom Left, tilted +0.8deg) -->
  <g transform="translate(10, 108) rotate(0.8 207 46)">
    <rect x="0" y="0" width="414" height="92" rx="18" fill="url(#stickBg1)" stroke="#ffb3d1" stroke-width="2.2" filter="url(#stickShadow)" />
    
    <rect x="180" y="-6" width="54" height="14" rx="3" fill="url(#cardWashiTape)" stroke="#f06292" stroke-width="0.7" opacity="0.8" />

    <!-- Cute Sticker Icon: Cloud Note Sheet -->
    <g transform="translate(16, 18)">
      <circle cx="28" cy="28" r="24" fill="#e8d5ff" stroke="#ff8fb8" stroke-width="1.5" />
      <rect x="18" y="16" width="20" height="24" rx="4" fill="#ffffff" stroke="#f06292" stroke-width="1.2" />
      <line x1="22" y1="22" x2="34" y2="22" stroke="#ff8fb8" stroke-width="1.2" stroke-linecap="round" />
      <line x1="22" y1="27" x2="32" y2="27" stroke="#ffb3d1" stroke-width="1.2" stroke-linecap="round" />
      <line x1="22" y1="32" x2="28" y2="32" stroke="#f06292" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Texts -->
    <text x="80" y="34" class="stick-font" font-size="12" font-weight="900" fill="#f06292">✿ ACTIVE PROJECTS</text>
    <text x="80" y="56" class="stick-font" font-size="13" font-weight="700" fill="#5a2a45">
      Aesthetic productivity apps like
      <tspan x="80" dy="19" fill="#f06292" font-size="12.5" font-weight="800">KumoNotes &amp; Expense-Tracking-System</tspan>
    </text>
  </g>

  <!-- CARD 4: DEV PHILOSOPHY (Bottom Right, tilted -0.8deg) -->
  <g transform="translate(436, 108) rotate(-0.8 207 46)">
    <rect x="0" y="0" width="414" height="92" rx="18" fill="url(#stickBg1)" stroke="#ffb3d1" stroke-width="2.2" filter="url(#stickShadow)" />
    
    <rect x="180" y="-6" width="54" height="14" rx="3" fill="url(#cardWashiTape)" stroke="#f06292" stroke-width="0.7" opacity="0.8" />

    <!-- Cute Sticker Icon: Sparkle Star -->
    <g transform="translate(16, 18)">
      <circle cx="28" cy="28" r="24" fill="#fff7d6" stroke="#ff8fb8" stroke-width="1.5" />
      <path d="M 28 17 L 31 25 L 39 28 L 31 31 L 28 39 L 25 31 L 17 28 L 25 25 Z" fill="#ffffff" stroke="#f06292" stroke-width="1.4" />
      <circle cx="28" cy="28" r="2.2" fill="#f06292" />
    </g>

    <!-- Texts -->
    <text x="80" y="34" class="stick-font" font-size="12" font-weight="900" fill="#a8688a">✿ DEV PHILOSOPHY</text>
    <text x="80" y="56" class="stick-font" font-size="13" font-weight="700" fill="#5a2a45" font-style="italic">
      &#8220;Detail-oriented digital artisan,
      <tspan x="80" dy="19" fill="#f06292" font-size="12.5" font-weight="800" font-style="italic">building from wireframe to deployment.&#8221;</tspan>
    </text>
  </g>
</svg>
