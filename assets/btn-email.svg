<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 56" width="100%" height="100%">
  <defs>
    <linearGradient id="btnEmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff0f5" />
    </linearGradient>

    <filter id="btnShadowEm" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#f06292" flood-opacity="0.14" />
    </filter>
  </defs>

  <style>
    /* <![CDATA[ */
    .btn-font {
      font-family: ui-rounded, 'Varela Round', 'Nunito', 'Quicksand', system-ui, -apple-system, sans-serif;
    }
    /* ]]> */
  </style>

  <!-- Button Pill Background -->
  <rect x="2" y="2" width="246" height="52" rx="26" fill="url(#btnEmBg)" stroke="#ffb3d1" stroke-width="2.5" filter="url(#btnShadowEm)" />

  <!-- Love Letter Icon -->
  <g transform="translate(18, 14)">
    <circle cx="14" cy="14" r="14" fill="#ffd6e7" stroke="#f06292" stroke-width="1.2" />
    <rect x="7" y="9" width="14" height="10" rx="2" fill="#ffffff" stroke="#f06292" stroke-width="1" />
    <path d="M 7 9 L 14 14 L 21 9" fill="none" stroke="#f06292" stroke-width="1" />
    <circle cx="14" cy="14" r="2" fill="#f06292" />
  </g>

  <!-- Text -->
  <text x="56" y="26" class="btn-font" font-size="13" font-weight="900" fill="#5a2a45">SEND AN EMAIL ↗</text>
  <text x="56" y="42" class="btn-font" font-size="10.5" font-weight="700" fill="#f06292">harra.ramos26@gmail.com</text>
</svg>
