<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 56" width="100%" height="100%">
  <defs>
    <linearGradient id="btnPortBgPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff0f5" />
    </linearGradient>

    <filter id="btnShadowPort" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#f06292" flood-opacity="0.14" />
    </filter>
  </defs>

  <style>
    /* <![CDATA[ */
    .btn-font {
      font-family: ui-rounded, 'Varela Round', 'Nunito', 'Quicksand', system-ui, -apple-system, sans-serif;
    }
    /* ]]> */
  </style>

  <!-- Button Pill Background -->
  <rect x="2" y="2" width="246" height="52" rx="26" fill="url(#btnPortBgPink)" stroke="#ffb3d1" stroke-width="2.5" filter="url(#btnShadowPort)" />

  <!-- Cube / Sparkle Icon -->
  <g transform="translate(18, 14)">
    <circle cx="14" cy="14" r="14" fill="#cfeaff" stroke="#f06292" stroke-width="1.2" />
    <polygon points="14,8 19,11 14,14 9,11" fill="#ffffff" stroke="#f06292" stroke-width="0.9" />
    <polygon points="9,11 14,14 14,20 9,17" fill="#ffd6e7" stroke="#f06292" stroke-width="0.9" />
    <polygon points="14,14 19,11 19,17 14,20" fill="#e8d5ff" stroke="#f06292" stroke-width="0.9" />
  </g>

  <!-- Text -->
  <text x="56" y="26" class="btn-font" font-size="13" font-weight="900" fill="#5a2a45">PORTFOLIO SOURCE ↗</text>
  <text x="56" y="42" class="btn-font" font-size="10.5" font-weight="700" fill="#f06292">harramos25/Harra_Portfolio</text>
</svg>
