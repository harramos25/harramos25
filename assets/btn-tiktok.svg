<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 195 50" width="100%" height="100%">
  <defs>
    <linearGradient id="btnTikBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff0f5" />
    </linearGradient>
    <filter id="btnShadowTik" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#f06292" flood-opacity="0.12" />
    </filter>
  </defs>

  <style>
    /* <![CDATA[ */
    .btn-font {
      font-family: ui-rounded, 'Varela Round', 'Nunito', 'Quicksand', system-ui, -apple-system, sans-serif;
    }
    /* ]]> */
  </style>

  <!-- Button Background -->
  <rect x="2" y="2" width="191" height="46" rx="23" fill="url(#btnTikBg)" stroke="#ffb3d1" stroke-width="2.2" filter="url(#btnShadowTik)" />

  <!-- TikTok Music Note Icon -->
  <g transform="translate(14, 11)">
    <circle cx="14" cy="14" r="14" fill="#cfeaff" stroke="#f06292" stroke-width="1.2" />
    <path d="M 16 8 C 16 11 18 12 20 12 L 20 10 C 18.5 10 17.5 9 17.5 8 Z" fill="#5a2a45" />
    <path d="M 14 8 L 14 17 C 14 18.5 12.5 19.5 11 19 C 9.5 18.5 9 17 10 15.5 C 11 14.5 13 14.5 14 15.5 L 14 8 Z" fill="#5a2a45" />
    <circle cx="11.5" cy="17.5" r="2" fill="#f06292" />
  </g>

  <!-- Text -->
  <text x="50" y="23" class="btn-font" font-size="12" font-weight="900" fill="#5a2a45">TIKTOK ↗</text>
  <text x="50" y="38" class="btn-font" font-size="9.5" font-weight="700" fill="#f06292">@codebyher</text>
</svg>
