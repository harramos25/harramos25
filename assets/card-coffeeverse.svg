<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 185" width="100%" height="100%">
  <defs>
    <linearGradient id="prjBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff0f5" />
    </linearGradient>

    <!-- Washi Tape Pattern -->
    <pattern id="prWashi1" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ffb3d1" stroke-width="2" />
      <line x1="4" y1="0" x2="4" y2="8" stroke="#ffd6e7" stroke-width="2" />
    </pattern>

    <filter id="pCardGlow1" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#f06292" flood-opacity="0.12" />
    </filter>
  </defs>

  <style>
    /* <![CDATA[ */
    .bubbly-font {
      font-family: ui-rounded, 'Varela Round', 'Nunito', 'Quicksand', system-ui, -apple-system, sans-serif;
    }

    @keyframes cardFloatAnim1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .card-pulse-border {
      animation: cardFloatAnim1 4.5s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .card-pulse-border { animation: none !important; }
    }
    /* ]]> */
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="414" height="178" rx="20" fill="url(#prjBg1)" stroke="#ffb3d1" stroke-width="2.6" filter="url(#pCardGlow1)" class="card-pulse-border" />

  <!-- Corner Washi Tape -->
  <rect x="30" y="-4" width="48" height="14" rx="3" fill="url(#prWashi1)" stroke="#f06292" stroke-width="0.8" opacity="0.85" />

  <!-- Top Pill Tag -->
  <g transform="translate(18, 14)">
    <rect x="0" y="0" width="134" height="20" rx="10" fill="#ffd6e7" stroke="#ff8fb8" stroke-width="1.2" />
    <circle cx="10" cy="10" r="3.2" fill="#f06292" />
    <text x="20" y="14" class="bubbly-font" font-size="10" font-weight="900" fill="#f06292">✿ SPECIALTY BREW</text>
  </g>

  <!-- Illustration Area & Title (Compact, stops at y=71) -->
  <g transform="translate(18, 44)">
    <!-- Cute Pink Coffee Cup Sticker (Circle radius 13, bottom at y=27) -->
    <circle cx="14" cy="14" r="13" fill="#ffd6e7" stroke="#f06292" stroke-width="1.3" />
    <path d="M 9 12 C 9 19 12 21 14 21 C 16 21 19 19 19 12 Z" fill="#ffffff" stroke="#f06292" stroke-width="1.1" />
    <ellipse cx="14" cy="12" rx="5" ry="1.8" fill="#ffb3d1" />
    <path d="M 19 13 C 21 13 21 15 19 15" fill="none" stroke="#f06292" stroke-width="0.9" />
    <path d="M 12 9 Q 11 6 13 5" fill="none" stroke="#f06292" stroke-width="0.8" stroke-linecap="round" />

    <text x="36" y="20" class="bubbly-font" font-size="19" font-weight="900" fill="#5a2a45">CoffeeVerse</text>
  </g>

  <!-- Description (Starts safely at y=95, with 24px clear margin from icon) -->
  <text x="18" y="95" class="bubbly-font" font-size="12" font-weight="600" fill="#5a2a45">
    <tspan x="18" dy="0">Interactive coffee enthusiast web application</tspan>
    <tspan x="18" dy="18">&amp; virtual brewing laboratory.</tspan>
  </text>

  <!-- Language Chips (Clean safe width) -->
  <g transform="translate(18, 138)">
    <rect x="0" y="0" width="48" height="20" rx="10" fill="#cfeaff" stroke="#ff8fb8" stroke-width="1.2" />
    <text x="24" y="14" class="bubbly-font" font-size="9" font-weight="800" fill="#5a2a45" text-anchor="middle">React</text>

    <rect x="54" y="0" width="70" height="20" rx="10" fill="#ffffff" stroke="#ffb3d1" stroke-width="1.2" />
    <text x="89" y="14" class="bubbly-font" font-size="9" font-weight="800" fill="#f06292" text-anchor="middle">TypeScript</text>

    <rect x="130" y="0" width="58" height="20" rx="10" fill="#ffd6e7" stroke="#ff8fb8" stroke-width="1.2" />
    <text x="159" y="14" class="bubbly-font" font-size="9" font-weight="800" fill="#5a2a45" text-anchor="middle">Tailwind</text>
  </g>

  <!-- Pill-Shaped "Open Repo ↗" Button (Isolated right block) -->
  <g transform="translate(302, 134)">
    <rect x="0" y="0" width="98" height="28" rx="14" fill="#ffffff" stroke="#f06292" stroke-width="1.6" />
    <text x="49" y="18" class="bubbly-font" font-size="10" font-weight="900" fill="#f06292" text-anchor="middle">OPEN REPO ↗</text>
  </g>
</svg>
