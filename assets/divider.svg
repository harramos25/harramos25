<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 40" width="100%" height="100%">
  <defs>
    <!-- Left Fade Gradient -->
    <linearGradient id="divLinePinkLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f06292" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ff8fb8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f06292" stop-opacity="1" />
    </linearGradient>

    <!-- Right Fade Gradient -->
    <linearGradient id="divLinePinkRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f06292" stop-opacity="1" />
      <stop offset="50%" stop-color="#ff8fb8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f06292" stop-opacity="0.1" />
    </linearGradient>

    <filter id="divShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f06292" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left Divider Line & Accent Dots -->
  <line x1="60" y1="20" x2="335" y2="20" stroke="url(#divLinePinkLeft)" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="343" cy="20" r="2" fill="#fff7d6" stroke="#f06292" stroke-width="0.6" />
  <circle cx="352" cy="20" r="2.8" fill="#ff8fb8" />

  <!-- Center Piece: Sticker Pill (Rock Solid Coordinates, Centered at x=430, y=20) -->
  <g filter="url(#divShadow)">
    <rect x="365" y="7" width="130" height="26" rx="13" fill="#ffffff" stroke="#ffb3d1" stroke-width="2" />
    
    <!-- Left Sparkle -->
    <path transform="translate(385, 20)" d="M 0 -6 Q 0 0 6 0 Q 0 0 0 6 Q 0 0 -6 0 Q 0 0 0 -6 Z" fill="#fff7d6" stroke="#f06292" stroke-width="0.8" />
    
    <!-- Left Heart -->
    <path transform="translate(407, 16) scale(0.75)" d="M 0 0 C -4 -4 -9 -2 -7 3 C -5 7 0 11 0 11 C 0 11 5 7 7 3 C 9 -2 4 -4 0 0 Z" fill="#ff8fb8" />
    
    <!-- Center Puffy Cloud -->
    <path d="M 423 23 C 419 23 417 19 420 16 C 419 13 422 11 425 12 C 427 9 433 9 435 12 C 438 11 441 13 440 16 C 443 19 441 23 437 23 Z" fill="#fff0f5" stroke="#f06292" stroke-width="1.3" />
    
    <!-- Right Heart -->
    <path transform="translate(453, 16) scale(0.75)" d="M 0 0 C -4 -4 -9 -2 -7 3 C -5 7 0 11 0 11 C 0 11 5 7 7 3 C 9 -2 4 -4 0 0 Z" fill="#ff8fb8" />
    
    <!-- Right Sparkle -->
    <path transform="translate(475, 20)" d="M 0 -6 Q 0 0 6 0 Q 0 0 0 6 Q 0 0 -6 0 Q 0 0 0 -6 Z" fill="#fff7d6" stroke="#f06292" stroke-width="0.8" />
  </g>

  <!-- Right Divider Line & Accent Dots -->
  <circle cx="508" cy="20" r="2.8" fill="#ff8fb8" />
  <circle cx="517" cy="20" r="2" fill="#fff7d6" stroke="#f06292" stroke-width="0.6" />
  <line x1="525" y1="20" x2="800" y2="20" stroke="url(#divLinePinkRight)" stroke-width="2.2" stroke-linecap="round" />
</svg>
