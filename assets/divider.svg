<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 32" width="100%" height="100%">
  <defs>
    <linearGradient id="divLinePinkLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb3d1" stop-opacity="0.05" />
      <stop offset="60%" stop-color="#ff8fb8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#f06292" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="divLinePinkRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f06292" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ff8fb8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ffb3d1" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <style>
    /* <![CDATA[ */
    @keyframes stickerPulse {
      0%, 100% { transform: scale(0.94); opacity: 0.75; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    .div-center {
      animation: stickerPulse 3.5s ease-in-out infinite;
      transform-origin: 430px 16px;
    }

    @media (prefers-reduced-motion: reduce) {
      .div-center { animation: none !important; }
    }
    /* ]]> */
  </style>

  <!-- Left Divider Line -->
  <line x1="40" y1="16" x2="350" y2="16" stroke="url(#divLinePinkLeft)" stroke-width="2" stroke-linecap="round" />
  <circle cx="350" cy="16" r="3" fill="#f06292" />
  <circle cx="334" cy="16" r="2" fill="#ff8fb8" />
  <circle cx="320" cy="16" r="1.5" fill="#fff7d6" />

  <!-- Center Piece: Clouds, Hearts, Sparkles Row -->
  <g class="div-center" transform="translate(430, 16)">
    <!-- Pill Backdrop -->
    <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#fff0f5" stroke="#ffb3d1" stroke-width="1.6" />

    <!-- Left Heart -->
    <path transform="translate(-42, -5) scale(0.7)" d="M 0 0 C -4 -4 -9 -2 -7 3 C -5 7 0 11 0 11 C 0 11 5 7 7 3 C 9 -2 4 -4 0 0 Z" fill="#ff8fb8" />

    <!-- Left Sparkle -->
    <path transform="translate(-20, 0)" d="M 0 -6 Q 0 0 6 0 Q 0 0 0 6 Q 0 0 -6 0 Q 0 0 0 -6 Z" fill="#fff7d6" stroke="#f06292" stroke-width="0.8" />

    <!-- Center Puffy Cloud -->
    <g transform="translate(-9, -7)">
      <path d="M 5 12 C 3 12 1 10 2 8 C 1 6 3 5 5 6 C 6 3 9 3 11 5 C 13 4 16 6 15 8 C 17 9 15 12 13 12 Z" fill="#ffffff" stroke="#f06292" stroke-width="1.2" />
      <circle cx="9" cy="8" r="1.5" fill="#ff8fb8" />
    </g>

    <!-- Right Sparkle -->
    <path transform="translate(20, 0)" d="M 0 -6 Q 0 0 6 0 Q 0 0 0 6 Q 0 0 -6 0 Q 0 0 0 -6 Z" fill="#fff7d6" stroke="#f06292" stroke-width="0.8" />

    <!-- Right Heart -->
    <path transform="translate(42, -5) scale(0.7)" d="M 0 0 C -4 -4 -9 -2 -7 3 C -5 7 0 11 0 11 C 0 11 5 7 7 3 C 9 -2 4 -4 0 0 Z" fill="#f06292" />
  </g>

  <!-- Right Divider Line -->
  <circle cx="510" cy="16" r="1.5" fill="#fff7d6" />
  <circle cx="526" cy="16" r="2" fill="#ff8fb8" />
  <circle cx="510" cy="16" r="3" fill="#f06292" />
  <line x1="510" y1="16" x2="820" y2="16" stroke="url(#divLinePinkRight)" stroke-width="2" stroke-linecap="round" />
</svg>
