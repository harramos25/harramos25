<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 56" width="100%" height="100%">
  <defs>
    <linearGradient id="hdrPinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff0f5" />
      <stop offset="50%" stop-color="#ffd6e7" />
      <stop offset="100%" stop-color="#fff0f5" />
    </linearGradient>

    <!-- Shimmer Filter -->
    <filter id="hdrShimmer" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#f06292" flood-opacity="0.1" />
    </filter>
  </defs>

  <style>
    /* <![CDATA[ */
    .hdr-font {
      font-family: ui-rounded, 'Varela Round', 'Nunito', 'Quicksand', system-ui, -apple-system, sans-serif;
    }

    @keyframes stickerWiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }
    .wiggle-icon {
      animation: stickerWiggle 3.5s ease-in-out infinite;
      transform-origin: 38px 28px;
    }

    @media (prefers-reduced-motion: reduce) {
      .wiggle-icon { animation: none !important; }
    }
    /* ]]> */
  </style>

  <!-- Puffy Rounded Banner Frame -->
  <rect x="2" y="2" width="856" height="52" rx="26" fill="url(#hdrPinkGrad)" stroke="#ffb3d1" stroke-width="2.8" filter="url(#hdrShimmer)" />

  <!-- Left Sticker Icon: Cute Cloud Sticker -->
  <g class="wiggle-icon" transform="translate(24, 12)">
    <circle cx="16" cy="16" r="16" fill="#ffffff" stroke="#ffb3d1" stroke-width="1.8" />
    <!-- Mini Cloud -->
    <path d="M 10 20 C 7 20 5 18 6 15 C 5 13 7 11 9 12 C 10 9 14 9 16 11 C 18 10 21 12 21 14 C 23 16 21 20 18 20 Z" fill="#cfeaff" stroke="#f06292" stroke-width="1.2" />
    <circle cx="23" cy="9" r="1.5" fill="#fff7d6" />
  </g>

  <!-- Header Title: lowercase friendly phrase -->
  <text x="68" y="36" class="hdr-font" font-size="22" font-weight="900" fill="#5a2a45" letter-spacing="-0.3">
    about me <tspan fill="#f06292" font-size="18">✿</tspan>
  </text>

  <!-- Cute Dashed Connecting Line -->
  <line x1="220" y1="28" x2="570" y2="28" stroke="#ffb3d1" stroke-width="1.5" stroke-dasharray="5,6" />

  <!-- Right Pill Badge -->
  <g transform="translate(590, 14)">
    <rect x="0" y="0" width="240" height="28" rx="14" fill="#ffffff" stroke="#ff8fb8" stroke-width="1.5" />
    <circle cx="14" cy="14" r="4" fill="#f06292" />
    <text x="26" y="19" class="hdr-font" font-size="11" font-weight="800" fill="#5a2a45" letter-spacing="0.8">STICKER NOTE #01 • SCRAPBOOK</text>
  </g>
</svg>
