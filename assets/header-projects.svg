<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 56" width="100%" height="100%">
  <defs>
    <linearGradient id="hdrPinkGradProjects" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff0f5" />
      <stop offset="50%" stop-color="#ffd6e7" />
      <stop offset="100%" stop-color="#fff0f5" />
    </linearGradient>
    <filter id="hdrShimmerProjects" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#f06292" flood-opacity="0.1" />
    </filter>
  </defs>

  <style>
    /* <![CDATA[ */
    .hdr-font {
      font-family: ui-rounded, 'Varela Round', 'Nunito', 'Quicksand', system-ui, -apple-system, sans-serif;
    }

    @keyframes stickerWiggle3 {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }
    .wiggle-icon3 {
      animation: stickerWiggle3 4s ease-in-out infinite;
      transform-origin: 38px 28px;
    }

    @media (prefers-reduced-motion: reduce) {
      .wiggle-icon3 { animation: none !important; }
    }
    /* ]]> */
  </style>

  <!-- Puffy Rounded Banner Frame -->
  <rect x="2" y="2" width="856" height="52" rx="26" fill="url(#hdrPinkGradProjects)" stroke="#ffb3d1" stroke-width="2.8" filter="url(#hdrShimmerProjects)" />

  <!-- Left Sticker Icon: Cute Ribbon Bow Sticker -->
  <g class="wiggle-icon3" transform="translate(24, 12)">
    <circle cx="16" cy="16" r="16" fill="#ffffff" stroke="#ffb3d1" stroke-width="1.8" />
    <!-- Ribbon Bow -->
    <path d="M 16 16 C 11 11 8 13 9 17 C 10 20 16 16 16 16 Z" fill="#ffd6e7" stroke="#f06292" stroke-width="1.2" />
    <path d="M 16 16 C 21 11 24 13 23 17 C 22 20 16 16 16 16 Z" fill="#ffd6e7" stroke="#f06292" stroke-width="1.2" />
    <circle cx="16" cy="16" r="3.2" fill="#f06292" />
    <path d="M 14 18 Q 11 23 9 24" fill="none" stroke="#f06292" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 18 18 Q 21 23 23 24" fill="none" stroke="#f06292" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Header Title -->
  <text x="68" y="36" class="hdr-font" font-size="22" font-weight="900" fill="#5a2a45" letter-spacing="-0.3">
    things i made <tspan fill="#f06292" font-size="18">✿</tspan>
  </text>

  <!-- Dashed Connecting Line -->
  <line x1="240" y1="28" x2="570" y2="28" stroke="#ffb3d1" stroke-width="1.5" stroke-dasharray="5,6" />

  <!-- Right Pill Badge -->
  <g transform="translate(590, 14)">
    <rect x="0" y="0" width="240" height="28" rx="14" fill="#ffffff" stroke="#ff8fb8" stroke-width="1.5" />
    <circle cx="14" cy="14" r="4" fill="#ff8fb8" />
    <text x="26" y="19" class="hdr-font" font-size="11" font-weight="800" fill="#5a2a45" letter-spacing="0.8">SHOWCASE #03 • PROJECTS &amp; APPS</text>
  </g>
</svg>
