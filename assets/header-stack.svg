<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 56" width="100%" height="100%">
  <defs>
    <linearGradient id="hdrPinkGradStack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff0f5" />
      <stop offset="50%" stop-color="#ffd6e7" />
      <stop offset="100%" stop-color="#fff0f5" />
    </linearGradient>
    <filter id="hdrShimmerStack" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#f06292" flood-opacity="0.1" />
    </filter>
  </defs>

  <style>
    /* <![CDATA[ */
    .hdr-font {
      font-family: ui-rounded, 'Varela Round', 'Nunito', 'Quicksand', system-ui, -apple-system, sans-serif;
    }

    @keyframes stickerWiggle2 {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-6deg); }
      75% { transform: rotate(6deg); }
    }
    .wiggle-icon2 {
      animation: stickerWiggle2 3.8s ease-in-out infinite;
      transform-origin: 38px 28px;
    }

    @media (prefers-reduced-motion: reduce) {
      .wiggle-icon2 { animation: none !important; }
    }
    /* ]]> */
  </style>

  <!-- Puffy Rounded Banner Frame -->
  <rect x="2" y="2" width="856" height="52" rx="26" fill="url(#hdrPinkGradStack)" stroke="#ffb3d1" stroke-width="2.8" filter="url(#hdrShimmerStack)" />

  <!-- Left Sticker Icon: Magic Wand & Sparkle Star -->
  <g class="wiggle-icon2" transform="translate(24, 12)">
    <circle cx="16" cy="16" r="16" fill="#ffffff" stroke="#ffb3d1" stroke-width="1.8" />
    <path d="M 16 7 L 18 13 L 24 16 L 18 19 L 16 25 L 14 19 L 8 16 L 14 13 Z" fill="#fff7d6" stroke="#f06292" stroke-width="1.2" />
    <circle cx="16" cy="16" r="2" fill="#ff8fb8" />
  </g>

  <!-- Header Title -->
  <text x="68" y="36" class="hdr-font" font-size="22" font-weight="900" fill="#5a2a45" letter-spacing="-0.3">
    my toolkit <tspan fill="#f06292" font-size="18">✿</tspan>
  </text>

  <!-- Dashed Connecting Line -->
  <line x1="210" y1="28" x2="570" y2="28" stroke="#ffb3d1" stroke-width="1.5" stroke-dasharray="5,6" />

  <!-- Right Pill Badge -->
  <g transform="translate(590, 14)">
    <rect x="0" y="0" width="240" height="28" rx="14" fill="#ffffff" stroke="#ff8fb8" stroke-width="1.5" />
    <circle cx="14" cy="14" r="4" fill="#e8d5ff" />
    <text x="26" y="19" class="hdr-font" font-size="11" font-weight="800" fill="#5a2a45" letter-spacing="0.8">DRAWER #02 • FAVORITE TOOLS</text>
  </g>
</svg>
