<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="100%" height="100%">
  <defs>
    <linearGradient id="scBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff0f5" />
    </linearGradient>

    <!-- Header Gradient Strips -->
    <linearGradient id="hStripPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd6e7" />
      <stop offset="100%" stop-color="#ffb3d1" />
    </linearGradient>
    <linearGradient id="hStripBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cfeaff" />
      <stop offset="100%" stop-color="#b5e2fa" />
    </linearGradient>
    <linearGradient id="hStripPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8d5ff" />
      <stop offset="100%" stop-color="#d6bbfb" />
    </linearGradient>
    <linearGradient id="hStripYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff7d6" />
      <stop offset="100%" stop-color="#ffe8a3" />
    </linearGradient>

    <filter id="cardPuffyShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#f06292" flood-opacity="0.1" />
    </filter>
  </defs>

  <style>
    /* <![CDATA[ */
    .bubbly-font {
      font-family: ui-rounded, 'Varela Round', 'Nunito', 'Quicksand', system-ui, -apple-system, sans-serif;
    }
    .col-title {
      font-size: 14.5px;
      font-weight: 900;
      fill: #5a2a45;
      letter-spacing: -0.2px;
    }
    .col-sub {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;
    }
    .menu-item {
      font-size: 12.5px;
      font-weight: 700;
      fill: #5a2a45;
    }
    .bullet {
      font-size: 11px;
    }
    .tag-badge {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.6px;
    }
    /* ]]> */
  </style>

  <!-- COLUMN 1: FRONTEND -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="200" height="284" rx="20" fill="url(#scBg)" stroke="#ffb3d1" stroke-width="2.5" filter="url(#cardPuffyShadow)" />
    
    <!-- Top Header Ribbon Strip -->
    <rect x="0" y="0" width="200" height="52" rx="20" fill="url(#hStripPink)" />
    <rect x="0" y="32" width="200" height="20" fill="url(#hStripPink)" />

    <g transform="translate(12, 10)">
      <!-- Bow Icon -->
      <circle cx="16" cy="16" r="15" fill="#ffffff" stroke="#f06292" stroke-width="1.2" />
      <path d="M 16 16 C 12 12 10 14 11 17 C 12 19 16 16 16 16 Z" fill="#ffd6e7" stroke="#f06292" stroke-width="1" />
      <path d="M 16 16 C 20 12 22 14 21 17 C 20 19 16 16 16 16 Z" fill="#ffd6e7" stroke="#f06292" stroke-width="1" />
      <circle cx="16" cy="16" r="2.8" fill="#f06292" />
      
      <text x="38" y="15" class="bubbly-font col-title">FRONTEND</text>
      <text x="38" y="27" class="bubbly-font col-sub" fill="#f06292">HEART &amp; CORE</text>
    </g>

    <!-- Items -->
    <g transform="translate(16, 78)" class="bubbly-font">
      <text x="0" y="0" class="bullet" fill="#f06292">✦</text>
      <text x="14" y="0" class="menu-item">TypeScript</text>

      <text x="0" y="22" class="bullet" fill="#f06292">✦</text>
      <text x="14" y="22" class="menu-item">JavaScript (ES6+)</text>

      <text x="0" y="44" class="bullet" fill="#f06292">✦</text>
      <text x="14" y="44" class="menu-item">React.js 19</text>

      <text x="0" y="66" class="bullet" fill="#f06292">✦</text>
      <text x="14" y="66" class="menu-item">Next.js (App Router)</text>

      <text x="0" y="88" class="bullet" fill="#f06292">✦</text>
      <text x="14" y="88" class="menu-item">Tailwind CSS</text>

      <text x="0" y="110" class="bullet" fill="#f06292">✦</text>
      <text x="14" y="110" class="menu-item">Vue.js</text>

      <text x="0" y="132" class="bullet" fill="#f06292">✦</text>
      <text x="14" y="132" class="menu-item">HTML5 &amp; CSS3</text>
    </g>

    <!-- Bottom Pill Badge -->
    <g transform="translate(14, 248)">
      <rect x="0" y="0" width="172" height="22" rx="11" fill="#ffffff" stroke="#ff8fb8" stroke-width="1.2" />
      <text x="86" y="15" class="bubbly-font tag-badge" fill="#f06292" text-anchor="middle">PRIMARY STACK ✿</text>
    </g>
  </g>

  <!-- COLUMN 2: CREATIVE & 3D -->
  <g transform="translate(222, 8)">
    <rect x="0" y="0" width="200" height="284" rx="20" fill="url(#scBg)" stroke="#ffb3d1" stroke-width="2.5" filter="url(#cardPuffyShadow)" />
    
    <rect x="0" y="0" width="200" height="52" rx="20" fill="url(#hStripBlue)" />
    <rect x="0" y="32" width="200" height="20" fill="url(#hStripBlue)" />

    <g transform="translate(12, 10)">
      <!-- Pastel 3D Cube Icon -->
      <circle cx="16" cy="16" r="15" fill="#ffffff" stroke="#b5e2fa" stroke-width="1.2" />
      <polygon points="16,10 22,13 16,16 10,13" fill="#cfeaff" stroke="#f06292" stroke-width="1" />
      <polygon points="10,13 16,16 16,22 10,19" fill="#ffd6e7" stroke="#f06292" stroke-width="1" />
      <polygon points="16,16 22,13 22,19 16,22" fill="#e8d5ff" stroke="#f06292" stroke-width="1" />
      
      <text x="38" y="15" class="bubbly-font col-title">CREATIVE &amp; 3D</text>
      <text x="38" y="27" class="bubbly-font col-sub" fill="#5a2a45">PLAYFUL 3D WEB</text>
    </g>

    <!-- Items -->
    <g transform="translate(16, 78)" class="bubbly-font">
      <text x="0" y="0" class="bullet" fill="#b5e2fa">✦</text>
      <text x="14" y="0" class="menu-item">Three.js</text>

      <text x="0" y="22" class="bullet" fill="#b5e2fa">✦</text>
      <text x="14" y="22" class="menu-item">React Three Fiber</text>

      <text x="0" y="44" class="bullet" fill="#b5e2fa">✦</text>
      <text x="14" y="44" class="menu-item">GSAP Animation</text>

      <text x="0" y="66" class="bullet" fill="#b5e2fa">✦</text>
      <text x="14" y="66" class="menu-item">Framer Motion</text>

      <text x="0" y="88" class="bullet" fill="#b5e2fa">✦</text>
      <text x="14" y="88" class="menu-item">Figma Design</text>

      <text x="0" y="110" class="bullet" fill="#b5e2fa">✦</text>
      <text x="14" y="110" class="menu-item">Blender (3D Assets)</text>
    </g>

    <!-- Bottom Pill Badge -->
    <g transform="translate(14, 248)">
      <rect x="0" y="0" width="172" height="22" rx="11" fill="#ffffff" stroke="#b5e2fa" stroke-width="1.2" />
      <text x="86" y="15" class="bubbly-font tag-badge" fill="#5a2a45" text-anchor="middle">CREATIVE CODE ✿</text>
    </g>
  </g>

  <!-- COLUMN 3: BACKEND & DB -->
  <g transform="translate(434, 8)">
    <rect x="0" y="0" width="200" height="284" rx="20" fill="url(#scBg)" stroke="#ffb3d1" stroke-width="2.5" filter="url(#cardPuffyShadow)" />
    
    <rect x="0" y="0" width="200" height="52" rx="20" fill="url(#hStripPurple)" />
    <rect x="0" y="32" width="200" height="20" fill="url(#hStripPurple)" />

    <g transform="translate(12, 10)">
      <!-- Cloud Database Icon -->
      <circle cx="16" cy="16" r="15" fill="#ffffff" stroke="#e8d5ff" stroke-width="1.2" />
      <ellipse cx="16" cy="13" rx="7" ry="3" fill="#e8d5ff" stroke="#f06292" stroke-width="1" />
      <path d="M 9 13 C 9 17 11 19 16 19 C 21 19 23 17 23 13" fill="none" stroke="#f06292" stroke-width="1" />
      
      <text x="38" y="15" class="bubbly-font col-title">BACKEND &amp; DB</text>
      <text x="38" y="27" class="bubbly-font col-sub" fill="#5a2a45">CLOUD DATA</text>
    </g>

    <!-- Items -->
    <g transform="translate(16, 78)" class="bubbly-font">
      <text x="0" y="0" class="bullet" fill="#e8d5ff">✦</text>
      <text x="14" y="0" class="menu-item">Node.js</text>

      <text x="0" y="22" class="bullet" fill="#e8d5ff">✦</text>
      <text x="14" y="22" class="menu-item">PHP</text>

      <text x="0" y="44" class="bullet" fill="#e8d5ff">✦</text>
      <text x="14" y="44" class="menu-item">Laravel</text>

      <text x="0" y="66" class="bullet" fill="#e8d5ff">✦</text>
      <text x="14" y="66" class="menu-item">MySQL</text>

      <text x="0" y="88" class="bullet" fill="#e8d5ff">✦</text>
      <text x="14" y="88" class="menu-item">Firebase</text>
    </g>

    <!-- Bottom Pill Badge -->
    <g transform="translate(14, 248)">
      <rect x="0" y="0" width="172" height="22" rx="11" fill="#ffffff" stroke="#e8d5ff" stroke-width="1.2" />
      <text x="86" y="15" class="bubbly-font tag-badge" fill="#5a2a45" text-anchor="middle">SOLID SERVERS ✿</text>
    </g>
  </g>

  <!-- COLUMN 4: DEV TOOLS -->
  <g transform="translate(646, 8)">
    <rect x="0" y="0" width="200" height="284" rx="20" fill="url(#scBg)" stroke="#ffb3d1" stroke-width="2.5" filter="url(#cardPuffyShadow)" />
    
    <rect x="0" y="0" width="200" height="52" rx="20" fill="url(#hStripYellow)" />
    <rect x="0" y="32" width="200" height="20" fill="url(#hStripYellow)" />

    <g transform="translate(12, 10)">
      <!-- Magic Star Wand Icon -->
      <circle cx="16" cy="16" r="15" fill="#ffffff" stroke="#ffe8a3" stroke-width="1.2" />
      <path d="M 16 9 L 18 13 L 22 14 L 19 17 L 20 21 L 16 19 L 12 21 L 13 17 L 10 14 L 14 13 Z" fill="#fff7d6" stroke="#f06292" stroke-width="1" />
      
      <text x="38" y="15" class="bubbly-font col-title">DEV TOOLS</text>
      <text x="38" y="27" class="bubbly-font col-sub" fill="#5a2a45">DAILY ESSENTIALS</text>
    </g>

    <!-- Items -->
    <g transform="translate(16, 78)" class="bubbly-font">
      <text x="0" y="0" class="bullet" fill="#ffb3d1">✦</text>
      <text x="14" y="0" class="menu-item">Git &amp; Version Control</text>

      <text x="0" y="22" class="bullet" fill="#ffb3d1">✦</text>
      <text x="14" y="22" class="menu-item">GitHub &amp; Actions</text>

      <text x="0" y="44" class="bullet" fill="#ffb3d1">✦</text>
      <text x="14" y="44" class="menu-item">VS Code</text>

      <text x="0" y="66" class="bullet" fill="#ffb3d1">✦</text>
      <text x="14" y="66" class="menu-item">Vercel Deployment</text>
    </g>

    <!-- Bottom Pill Badge -->
    <g transform="translate(14, 248)">
      <rect x="0" y="0" width="172" height="22" rx="11" fill="#ffffff" stroke="#ffe8a3" stroke-width="1.2" />
      <text x="86" y="15" class="bubbly-font tag-badge" fill="#5a2a45" text-anchor="middle">WORKFLOW PRO ✿</text>
    </g>
  </g>
</svg>
